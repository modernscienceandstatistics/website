chamy i dopytujemy, aż dobrze zrozumiemy problem, kontekst i decyzje, które mają zapaść.`,en:`We listen and ask questions until we understand the problem, the context and the decisions to be made.`}},{title:{pl:`Projektujemy`,en:`We design`},body:{pl:`Dobieramy metodę do pytania: badanie, analizę danych, test koncepcji, narzędzie albo szkolenie.`,en:`We match the method to the question: a study, data analysis, concept test, tool or training.`}},{title:{pl:`Badamy i analizujemy`,en:`We research and analyse`},body:{pl:`Realizujemy projekt z naukową rzetelnością - od zbierania danych po modelowanie.`,en:`We run the project with scientific rigour - from data collection to modelling.`}},{title:{pl:`Co to oznacza dla Ciebie?`,en:`What does it mean for you?`},body:{pl:`Każdy raport kończy się praktycznymi wnioskami. Nie produkujemy statystyk dla samych statystyk.`,en:`Every report ends with practical conclusions. We do not produce statistics for their own sake.`}}],servicesEyebrow:{pl:`Usługi`,en:`Services`},servicesTitle:{pl:`Kompleksowe wsparcie: badania, dane, technologia i edukacja`,en:`End-to-end support: research, data, technology and education`},projectsEyebrow:{pl:`Realizacje`,en:`Projects`},projectsTitle:{pl:`Nauka, która przynosi mierzalne efekty`,en:`Science with measurable results`},audiencesTitle:{pl:`Dla kogo pracujemy`,en:`Who we work with`},audiences:{pl:[`Biznes`,`Nauka`,`Instytucje kultury`,`NGO`,`Sektor publiczny`],en:[`Business`,`Academia`,`Cultural institutions`,`NGOs`,`Public sector`]}},Ro={seoDescription:{pl:`Kim jesteśmy: niezależna, rodzinna firma naukowo-badawcza, której podstawową wartością jest otwarty dialog.`,en:`Who we are: an independent, family-run research company built on open dialogue.`},eyebrow:{pl:`O nas`,en:`About us`},title:{pl:`Niezależna firma badawcza, która zaczyna od rozmowy`,en:`An independent research company that starts with a conversation`},lead:{pl:`MS² łączy naukę, technologię, analizę danych i praktyczne rozwiązywanie problemów. Realizujemy projekty dla biznesu, nauki, instytucji kultury, NGO i sektora publicznego.`,en:`MS² brings together science, technology, data analysis and practical problem-solving. We work with businesses, academia, cultural institutions, NGOs and the public sector.`},storyTitle:{pl:`Kim jesteśmy`,en:`Who we are`},story:{pl:[`Nie jesteśmy wyłącznie statystykami ani naukowcami, którzy dorabiają analizami. Jesteśmy zespołem, który oferuje kompleksowe usługi badawcze, analityczne, technologiczne i szkoleniowe - od pierwszego pomysłu po wdrożenie wniosków.`,`W zależności od potrzeb projektu współpracujemy z siecią ekspertów z różnych dziedzin. Dzięki temu możemy dobrać kompetencje do problemu, a nie problem do kompetencji.`,`MS² to firma rodzinna. Dla nas oznacza to przede wszystkim osobiste zaangażowanie i odpowiedzialność za każdy projekt, pod którym się podpisujemy.`],en:[`We are not just statisticians, nor academics doing analyses on the side. We are a team offering end-to-end research, analytics, technology and training services - from the first idea to putting conclusions into practice.`,`Depending on the project, we work with a network of experts from different fields. That way we match expertise to the problem, not the problem to our expertise.`,`MS² is a family business. For us, that means above all personal commitment and responsibility for every project we put our name to.`]},valuesTitle:{pl:`Nasze wartości`,en:`Our values`},values:[{title:{pl:`Otwarty dialog`,en:`Open dialogue`},body:{pl:`Nie przychodzimy z gotowym narzędziem. Najpierw rozmawiamy i próbujemy zrozumieć problem, a dopiero potem proponujemy rozwiązania.`,en:`We do not arrive with a ready-made tool. We talk first and try to understand the problem before proposing solutions.`}},{title:{pl:`Praktyczne wnioski`,en:`Practical conclusions`},body:{pl:`Każdy raport odpowiada na pytanie: „Co to oznacza dla Ciebie?”. Liczy się to, co możesz zrobić z wynikami.`,en:`Every report answers the question: "What does this mean for you?". What matters is what you can do with the results.`}},{title:{pl:`Naukowa rzetelność`,en:`Scientific rigour`},body:{pl:`Pracujemy zgodnie ze standardami badań naukowych - przejrzyście, metodologicznie poprawnie i uczciwie wobec danych.`,en:`We work to scientific research standards - transparently, with sound methodology and honesty towards the data.`}},{title:{pl:`Osobiste zaangażowanie`,en:`Personal commitment`},body:{pl:`Jako firma rodzinna bierzemy osobistą odpowiedzialność za jakość naszej pracy i relacje z klientami.`,en:`As a family business, we take personal responsibility for the quality of our work and our client relationships.`}}]},zo={seoDescription:{pl:`Pięć obszarów działalności MS²: badania behawioralne, data science i statystyka, testowanie koncepcji, narzędzia naukowe oraz MS² Academy.`,en:`MS²'s five areas of work: behavioural research, data science and statistics, concept testing, scientific tools and MS² Academy.`},eyebrow:{pl:`Usługi`,en:`Services`},title:{pl:`Understand people. Test ideas. Make better decisions.`,en:`Understand people. Test ideas. Make better decisions.`},lead:{pl:`Pięć obszarów, które łączymy w zależności od potrzeb - od jednorazowej konsultacji po kompleksowy projekt badawczy.`,en:`Five areas we combine as needed - from a one-off consultation to a full research project.`}},Bo={seoDescription:{pl:`MS² Academy: szkolenia i warsztaty dla biznesu, naukowców oraz program Science to Business.`,en:`MS² Academy: training and workshops for businesses, researchers and the Science to Business programme.`},eyebrow:{pl:`MS² Academy`,en:`MS² Academy`},title:{pl:`Szkolenia, które łączą naukę z praktyką`,en:`Training that connects science with practice`},lead:{pl:`Prowadzimy szkolenia i warsztaty nie tylko dla naukowców. Przekładamy wiedzę z psychologii, neuronauki i analizy danych na język biznesu i instytucji.`,en:`Our training and workshops are not just for researchers. We translate psychology, neuroscience sza część pracy dzieje się wcześniej - wtedy, gdy wspólnie ustalamy, na jakie pytanie naprawdę chcemy odpowiedzieć.`,`Dlatego w MS² nie przychodzimy z jednym narzędziem, które pasuje do każdego problemu. Najpierw rozmawiamy: o celu, o kontekście, o tym, jakie decyzje mają zapaść na podstawie wyników. Dopiero potem dobieramy metodę - czasem będzie to eksperyment, czasem analiza istniejących danych, a czasem dedykowana aplikacja.`,`Każdy nasz raport kończy się odpowiedzią na pytanie: co to oznacza dla Ciebie? Nie produkujemy statystyk dla samych statystyk. Chcemy, żeby wyniki dało się przełożyć na konkretne działania.`],en:[`Many research projects begin with a ready-made answer: "we need a survey", "let's do eye-tracking", "let's run a regression". Yet the most valuable part of the work happens earlier - when we agree together on the question we actually want to answer.`,`That is why at MS² we never arrive with a single tool that supposedly fits every problem. We start by talking: about the goal, the context and the decisions the results should inform. Only then do we choose the method - sometimes an experiment, sometimes an analysis of existing data, sometimes a purpose-built application.`,`Every report we write ends by answering one question: what does this mean for you? We do not produce statistics for their own sake. We want results that translate into concrete action.`]}}],Lv=()=>{let e=ya(),t=Iv.toSorted((e,t)=>t.publishedOn.localeCompare(e.publishedOn));return(0,I.jsxs)(I.Fragment,{children:[(0,I.jsx)(pv,{title:e(z.insights),description:e(Uo.seoDescription)}),(0,I.jsx)(Io,{eyebrow:e(Uo.eyebrow),title:e(Uo.title),lead:e(Uo.lead)}),(0,I.jsx)(uv,{children:t.length===0?(0,I.jsx)(`p`,{className:F({fontSize:`lg`,color:`fg.muted`}),children:e(B.noPosts)}):(0,I.jsx)(`div`,{className:F({display:`grid`,gridTemplateColumns:{base:`1fr`,md:`repeat(2, 1fr)`,lg:`repeat(3, 1fr)`},gap:`5`}),children:t.map(e=>(0,I.jsx)(Fv,{post:e},e.slug))})})]})},Rv=()=>{let e=va(),t=ya(),{slug
